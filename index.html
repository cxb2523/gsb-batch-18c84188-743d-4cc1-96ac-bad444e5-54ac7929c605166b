<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxelWeave Studio</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1d222b;
    --panel-2: #262d39;
    --text: #e8ecf2;
    --muted: #9aa7b8;
    --accent: #6ea8fe;
    --ok: #3fb96b;
    --error-bg: #3a1d22;
    --error-border: #e05260;
    --error-text: #ffb3ba;
    --border: #343c49;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .3px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { display: flex; gap: 20px; padding: 20px 24px; align-items: flex-start; flex-wrap: wrap; }

  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; }
  #controls { width: 320px; flex: 0 0 320px; }
  #preview { flex: 1 1 420px; min-width: 320px; }

  .field { margin-bottom: 14px; }
  .field label { display: flex; justify-content: space-between; font-weight: 600;
    margin-bottom: 5px; font-size: 13px; }
  .field label .hint { color: var(--muted); font-weight: 400; }
  .field input[type="number"], .field textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 9px 10px;
    font: inherit; }
  .field textarea { min-height: 84px; resize: vertical;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; }
  .field.invalid input, .field.invalid textarea {
    border-color: var(--error-border); background: #2c1d20; }
  .field .field-error { display: none; color: var(--error-text); font-size: 12px; margin-top: 4px; }
  .field.invalid .field-error { display: block; }

  #message { display: none; border-radius: 8px; padding: 10px 12px;
    margin: 12px 0; font-size: 13px; border: 1px solid transparent; }
  #message.show { display: block; }
  #message.error { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  #message.success { background: #16301f; border-color: var(--ok); color: #a9ecc3; }

  .buttons { display: flex; gap: 10px; margin-top: 8px; }
  button { flex: 1; border: 0; border-radius: 8px; padding: 11px 14px;
    font: inherit; font-weight: 700; cursor: pointer; }
  #weaveBtn { background: var(--accent); color: #0c1626; }
  #exportBtn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  #snapshotInfo { margin-top: 14px; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--border); padding-top: 12px; white-space: pre-wrap; }
  #snapshotInfo strong { color: var(--text); }

  .canvas-wrap { background:
      repeating-conic-gradient(#20262f 0% 25%, #1a1f27 0% 50%) 0 0 / 20px 20px;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px;
    display: flex; justify-content: center; min-height: 220px; align-items: center;
    overflow: auto; }
  canvas { image-rendering: pixelated; max-width: 100%; height: auto;
    background: transparent; }
  #emptyNote { color: var(--muted); font-size: 13px; }
  .meta { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .offline-badge { float: right; font-size: 11px; color: var(--ok);
    border: 1px solid var(--ok); border-radius: 999px; padding: 2px 9px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <span class="offline-badge">● offline ready</span>
  <h1>VoxelWeave Studio</h1>
  <p>Weave palettes into tileable low-poly texture grids — everything runs locally in this page.</p>
</header>

<main>
  <section class="panel" id="controls" aria-label="Generation parameters">
    <div class="field" id="field-rows">
      <label for="rowsInput">Rows <span class="hint">1–512</span></label>
      <input type="number" id="rowsInput" min="1" max="512" step="1" value="8" inputmode="numeric">
      <div class="field-error" id="error-rows"></div>
    </div>

    <div class="field" id="field-columns">
      <label for="columnsInput">Columns <span class="hint">1–512</span></label>
      <input type="number" id="columnsInput" min="1" max="512" step="1" value="8" inputmode="numeric">
      <div class="field-error" id="error-columns"></div>
    </div>

    <div class="field" id="field-cellSize">
      <label for="cellSizeInput">Cell size (px) <span class="hint">1–256</span></label>
      <input type="number" id="cellSizeInput" min="1" max="256" step="1" value="16" inputmode="numeric">
      <div class="field-error" id="error-cellSize"></div>
    </div>

    <div class="field" id="field-palette">
      <label for="paletteInput">Palette <span class="hint">hex colors, separated by spaces/commas</span></label>
      <textarea id="paletteInput" spellcheck="false">#264653, #2a9d8f, #e9c46a, #f4a261, #e76f51</textarea>
      <div class="field-error" id="error-palette"></div>
    </div>

    <div id="message" role="alert" aria-live="assertive"></div>

    <div class="buttons">
      <button id="weaveBtn" type="button">Weave</button>
      <button id="exportBtn" type="button" disabled>Export atlas + manifest</button>
    </div>

    <div id="snapshotInfo">No successful generation yet.</div>
  </section>

  <section class="panel" id="preview" aria-label="Preview">
    <div class="canvas-wrap">
      <canvas id="canvas" width="0" height="0" style="display:none"></canvas>
      <div id="emptyNote">Press <strong>Weave</strong> to generate a grid.</div>
    </div>
    <div class="meta" id="canvasMeta"></div>
  </section>
</main>

<script src="voxelweave.js"></script>
<script>
(function () {
  'use strict';
  var VW = window.VoxelWeave;

  var els = {
    rows: document.getElementById('rowsInput'),
    columns: document.getElementById('columnsInput'),
    cellSize: document.getElementById('cellSizeInput'),
    palette: document.getElementById('paletteInput'),
    weaveBtn: document.getElementById('weaveBtn'),
    exportBtn: document.getElementById('exportBtn'),
    message: document.getElementById('message'),
    canvas: document.getElementById('canvas'),
    emptyNote: document.getElementById('emptyNote'),
    canvasMeta: document.getElementById('canvasMeta'),
    snapshotInfo: document.getElementById('snapshotInfo')
  };

  // The single source of truth for the last SUCCESSFUL generation.
  // Both the canvas and every export derive from this; input edits never
  // touch it until a new generation fully succeeds.
  var lastGood = null; // { snapshot, model, dataUrl }

  var FIELD_MAP = {
    rows: ['field-rows', 'error-rows'],
    columns: ['field-columns', 'error-columns'],
    cellSize: ['field-cellSize', 'error-cellSize'],
    cellCount: ['field-rows', 'error-rows'],
    totalPixels: ['field-cellSize', 'error-cellSize'],
    palette: ['field-palette', 'error-palette']
  };

  function clearFieldErrors() {
    ['rows', 'columns', 'cellSize', 'palette'].forEach(function (name) {
      var ids = FIELD_MAP[name] || ['field-' + name, 'error-' + name];
      var field = document.getElementById(ids[0]);
      var err = document.getElementById(ids[1]);
      if (field) field.classList.remove('invalid');
      if (err) err.textContent = '';
    });
  }

  function markFieldError(field, message) {
    var ids = FIELD_MAP[field];
    if (!ids) return;
    var fieldEl = document.getElementById(ids[0]);
    var errEl = document.getElementById(ids[1]);
    fieldEl.classList.add('invalid');
    errEl.textContent = message;
  }

  function showMessage(kind, text) {
    els.message.className = 'show ' + kind;
    els.message.textContent = text;
  }

  function clearMessage() {
    els.message.className = '';
    els.message.textContent = '';
  }

  function readInputs() {
    return {
      rows: els.rows.value,
      columns: els.columns.value,
      cellSize: els.cellSize.value,
      paletteText: els.palette.value
    };
  }

  function renderSnapshotInfo(snapshot) {
    els.snapshotInfo.innerHTML =
      '<strong>Last successful generation</strong>\n' +
      'rows: ' + snapshot.rows + ' · columns: ' + snapshot.columns +
      ' · cell size: ' + snapshot.cellSize + 'px\n' +
      'cells: ' + snapshot.cellCount + ' · sheet: ' +
      snapshot.widthPx + '×' + snapshot.heightPx + 'px\n' +
      'palette: ' + snapshot.palette.join(', ') + '\n' +
      'generated at: ' + snapshot.generatedAt;
  }

  function weave() {
    clearFieldErrors();
    var input = readInputs();

    // --- Palette first (it is not part of the numeric linked checks) ---
    var parsed = VW.parsePalette(input.paletteText);
    if (parsed.invalid.length) {
      markFieldError('palette', 'Invalid color(s): ' + parsed.invalid.join(', '));
    }
    if (!parsed.colors.length) {
      markFieldError('palette', 'Provide at least one valid hex color, e.g. #2a9d8f.');
      showMessage('error', 'Generation rejected: the palette contains no usable colors. ' +
        'The previous canvas (if any) has been kept.');
      // No canvas mutation: lastGood stays intact.
      return false;
    }

    // --- Linked numeric validation (per-field caps + combined thresholds) ---
    var result = VW.validateParams({
      rows: input.rows,
      columns: input.columns,
      cellSize: input.cellSize
    });

    if (!result.ok) {
      var err = result.error;
      markFieldError(err.field, err.message);
      showMessage('error', 'Generation rejected — ' + err.message +
        ' The previous canvas has been kept.');
      // Explicitly do NOT touch the canvas: no half-written output, no clear.
      return false;
    }

    // --- All checks passed; generate from the validated params only ---
    var params = result.params;
    var model = VW.buildGridModel(params, parsed.colors);
    VW.renderGrid(els.canvas, model);

    var snapshot = VW.createSnapshot(params, parsed.colors, new Date().toISOString());
    lastGood = {
      snapshot: snapshot,
      model: model,
      dataUrl: els.canvas.toDataURL('image/png')
    };

    els.canvas.style.display = '';
    els.emptyNote.style.display = 'none';
    els.exportBtn.disabled = false;
    els.canvasMeta.textContent =
      model.cellCount + ' cells (' + model.rows + '×' + model.columns +
      '), each ' + model.cellSize + 'px — sheet ' +
      model.widthPx + '×' + model.heightPx + 'px, tileable edge-to-edge.';
    renderSnapshotInfo(snapshot);
    showMessage('success', 'Weave complete: ' + model.cellCount +
      ' cells at ' + model.cellSize + 'px per cell.');
    return true;
  }

  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function exportBundle() {
    if (!lastGood) {
      showMessage('error', 'Nothing to export yet — generate a grid first.');
      return null;
    }
    // Manifest is built ONLY from the success snapshot, so editing an input
    // without re-weaving can never leak un-generated values into an export.
    var manifest = VW.buildManifest(lastGood.snapshot);
    var manifestText = JSON.stringify(manifest, null, 2);

    // Decode the snapshot's PNG data URL into a binary blob for the atlas.
    var bin = atob(lastGood.dataUrl.split(',')[1]);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    download('voxelweave-atlas.png', bytes, 'image/png');
    download('voxelweave-manifest.json', manifestText, 'application/json');
    showMessage('success', 'Exported atlas and manifest using the last successful ' +
      'generation parameters (' + manifest.rows + '×' + manifest.columns +
      ', ' + manifest.cellSize + 'px cells).');
    return { manifest: manifest, manifestText: manifestText };
  }

  els.weaveBtn.addEventListener('click', weave);
  els.exportBtn.addEventListener('click', exportBundle);

  // Test/automation hook: headless verification drives the exact same code
  // path a human uses.
  window.VoxelWeaveApp = {
    weave: weave,
    exportBundle: exportBundle,
    getLastGood: function () { return lastGood; },
    readInputs: readInputs,
    showMessage: showMessage
  };
})();
</script>
</body>
</html>
